[package]
name = "don_rac"
version = "0.1.0"
edition = "2021"
description = "QSU Dọn Rác Máy Tính - dọn temp, cache trình duyệt, cache Windows Update, thùng rác"

[[bin]]
name = "DonRacMayTinh"
path = "src/main.rs"

[dependencies]
qsu_common = { path = "../qsu_common" }
native-windows-gui = "1.0"
winapi = { version = "0.3", features = ["shellapi", "winuser", "winerror", "wingdi", "winnt", "commctrl"] }
